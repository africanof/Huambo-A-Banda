<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huambo É A Banda — sem rede</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#1b130f; color:#f7efe2;
         font:16px/1.5 system-ui, sans-serif; text-align:center; padding:24px; box-sizing:border-box; }
  .c { max-width:420px; background:#2a1e19; border-top:5px solid #f2b632; border-radius:20px; padding:28px; }
  h1 { color:#f2b632; font-size:24px; margin:0 0 8px; }
  button { margin-top:16px; background:#f2b632; color:#2a1a0c; border:0; border-radius:16px; padding:12px 22px; font:inherit; font-weight:700; }
</style>
</head>
<body>
<div class="c">
  <h1>Huambo É A Banda</h1>
  <p>Estás sem ligação à internet. O Huambo espera por ti — volta a tentar quando tiveres rede.</p>
  <button onclick="location.reload()">Tentar outra vez</button>
</div>
</body>
</html>
