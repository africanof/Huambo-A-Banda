name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.2

jobs:
  server:
    name: Servidor (Colyseus)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379
      - run: npm run build

  database:
    name: Base de dados (migrações + RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: supabase/tests/run_local.sh
        env:
          PGURL: postgres://postgres:postgres@127.0.0.1:5432/postgres

  client:
    name: Cliente (Godot) + ponta-a-ponta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Instalar Godot
        run: |
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - name: Importar projeto
        run: godot --headless --path client --import
      - name: Testes unitários do cliente
        run: godot --headless --path client -s res://tests/run_tests.gd && godot --headless --path client -s res://tests/check_scripts.gd
      - name: Fixtures atualizadas
        working-directory: server
        run: |
          npm ci
          npm run fixtures
          git diff --exit-code ../client/tests/fixtures
      - name: Ponta-a-ponta (2 clientes Godot reais)
        run: |
          (cd server && ALLOW_GUESTS=true GUEST_TOKEN_SECRET=ci-guest-secret-0123456789abcdef0123 LOG_LEVEL=warn npx tsx src/index.ts &)
          for i in $(seq 1 30); do curl -sf localhost:2567/health && break; sleep 1; done
          godot --headless --path client -- --autotest --life --name=CI1 --expect-peers=2 & A=$!
          sleep 1
          godot --headless --path client -- --autotest --travel --name=CI2 --expect-peers=2 & B=$!
          wait $A && wait $B
